name: Build Magisk Module

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive   # pulls dungxnd/ViPERDSP@quadric-wowdf

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make ${{ matrix.abi }} \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: libv4a_re-${{ matrix.abi }}-${{ steps.ver.outputs.name }}
          path: out/libv4a_re_${{ matrix.abi }}.so
          retention-days: 7

  package:
    name: Package Magisk module
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build all ABIs & prepare module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make module \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViPER4Android-RE-${{ steps.ver.outputs.name }}
          path: out/magisk_module/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check if version already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download module directory
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ViPER4Android-RE-${{ steps.check.outputs.version }}
          path: dist/module/

      - name: Repackage as flashable zip
        if: steps.check.outputs.skip == 'false'
        run: |
          cd dist/module
          zip -r9 ../ViPER4Android-RE-${{ steps.check.outputs.version }}.zip .
          cd ../..

      - name: Generate update.json
        if: steps.check.outputs.skip == 'false'
        run: |
          cat > dist/update.json <<EOF
          {
            "version": "${{ steps.check.outputs.version }}",
            "versionCode": $(grep '^versionCode=' module/module.prop | cut -d= -f2),
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.check.outputs.version }}/ViPER4Android-RE-${{ steps.check.outputs.version }}.zip",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.check.outputs.version }}"
          }
          EOF
          cat dist/update.json

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   ${{ steps.check.outputs.version }}
          name:       "ViPER4Android RE ${{ steps.check.outputs.version }}"
          draft:      false
          prerelease: ${{ contains(steps.check.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/update.json
          body: |
            ## ViPER4Android Reverse Engineered ${{ steps.check.outputs.version }}

            ### Installation
            Flash via Magisk / KernelSU / APatch.

            ### Changes
            See [commits](https://github.com/${{ github.repository }}/commits/${{ steps.check.outputs.version }}) for details.
