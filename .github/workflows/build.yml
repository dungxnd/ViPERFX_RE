name: Build Magisk Module

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive   # pulls dungxnd/ViPERDSP@quadric-wowdf

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make ${{ matrix.abi }} \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: libv4a_re-${{ matrix.abi }}-${{ steps.ver.outputs.name }}
          path: out/libv4a_re_${{ matrix.abi }}.so
          retention-days: 7

  package:
    name: Package non-AIDL module
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build all ABIs & prepare module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make module \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViPER4Android-RE-${{ steps.ver.outputs.name }}
          path: out/magisk_module/
          retention-days: 30

  build-aidl:
    name: Build AIDL (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate AIDL stubs
        run: |
          # aidl binary ships inside Android SDK build-tools (pre-installed on ubuntu-latest)
          AIDL=$(ls $ANDROID_HOME/build-tools/*/aidl 2>/dev/null | sort -V | tail -1)
          echo "Using aidl: $AIDL"

          # Sparse-clone audio/effect AIDL from platform/hardware/interfaces
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/hardware/interfaces \
            aosp-interfaces
          cd aosp-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            audio/aidl/android/hardware/audio/effect \
            audio/aidl/android/hardware/audio/common \
            audio/aidl/aidl_api/android.hardware.audio.effect/3 \
            common/aidl/android/hardware/common \
            common/fmq/aidl/android/hardware/common/fmq
          git checkout
          cd ..

          # android.media.audio.common types live in platform/system/hardware/interfaces
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/system/hardware/interfaces \
            aosp-system-interfaces
          cd aosp-system-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            media/aidl/android/media/audio/common \
            media/aidl/android/media/audio/eraser
          git checkout
          cd ..

          # libbinder_ndk C++ helper headers removed from NDK in r28; source from frameworks/native
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/frameworks/native \
            aosp-frameworks-native
          cd aosp-frameworks-native
          git sparse-checkout init --cone
          git sparse-checkout set libs/binder/ndk/include_cpp/android
          git checkout
          cd ..

          # NOTE: do NOT clone system/libfmq — its headers transitively include
          # platform-only headers (utils/Log.h, cutils/ashmem.h, utils/SystemClock.h,
          # android-base/unique_fd.h) that are absent from the Android NDK.
          # We write NDK-compatible shims for every required header instead.

          mkdir -p aidl-gen/src \
            aidl-gen/include/android \
            aidl-gen/include/fmq \
            aidl-gen/include/cutils \
            aidl-gen/include/utils \
            aidl-gen/include/android-base

          cp aosp-frameworks-native/libs/binder/ndk/include_cpp/android/*.h aidl-gen/include/android/

          # Copy committed NDK-only shim headers (cutils/, utils/, android-base/, fmq/)
          cp -r aidl-shims/include/. aidl-gen/include/

          # Pass 0a: android.hardware.common (NativeHandle etc.)
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/common/aidl/android/hardware/common/*.aidl

          # Pass 0b: android.hardware.common.fmq (MQDescriptor etc.)
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/common/fmq/aidl/android/hardware/common/fmq/*.aidl

          # Pass 0c: android.hardware.audio.common (SinkMetadata, AudioPortConfig etc.)
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/common/*.aidl

          # Pass 1: android.media.audio.common + eraser
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-system-interfaces/media/aidl/android/media/audio/common/*.aidl \
            aosp-system-interfaces/media/aidl/android/media/audio/eraser/*.aidl

          # Pass 2: effect interfaces
          $AIDL --lang=ndk --structured --stability=vintf \
            --min_sdk_version=31 \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/effect/*.aidl

          echo "Generated files:"
          find aidl-gen/ -name '*.cpp' -o -name '*.h' | sort

      - name: Build AIDL ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make aidl-${{ matrix.abi }} \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload AIDL .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: libv4a_aidl-${{ matrix.abi }}-${{ steps.ver.outputs.name }}
          path: out/libv4a_aidl_${{ matrix.abi }}.so
          retention-days: 7

  package-aidl:
    name: Package AIDL module
    runs-on: ubuntu-latest
    needs: build-aidl

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate AIDL stubs
        run: |
          AIDL=$(ls $ANDROID_HOME/build-tools/*/aidl 2>/dev/null | sort -V | tail -1)
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/hardware/interfaces \
            aosp-interfaces
          cd aosp-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            audio/aidl/android/hardware/audio/effect \
            audio/aidl/android/hardware/audio/common \
            audio/aidl/aidl_api/android.hardware.audio.effect/3 \
            common/aidl/android/hardware/common \
            common/fmq/aidl/android/hardware/common/fmq
          git checkout
          cd ..
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/system/hardware/interfaces \
            aosp-system-interfaces
          cd aosp-system-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            media/aidl/android/media/audio/common \
            media/aidl/android/media/audio/eraser
          git checkout
          cd ..
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/frameworks/native \
            aosp-frameworks-native
          cd aosp-frameworks-native
          git sparse-checkout init --cone
          git sparse-checkout set libs/binder/ndk/include_cpp/android
          git checkout
          cd ..
          # NOTE: do NOT clone system/libfmq — uses platform-only headers not in NDK.
          mkdir -p aidl-gen/src \
            aidl-gen/include/android \
            aidl-gen/include/fmq \
            aidl-gen/include/cutils \
            aidl-gen/include/utils \
            aidl-gen/include/android-base
          cp aosp-frameworks-native/libs/binder/ndk/include_cpp/android/*.h aidl-gen/include/android/
          # Copy committed NDK-only shim headers (cutils/, utils/, android-base/, fmq/)
          cp -r aidl-shims/include/. aidl-gen/include/

          # Pass 0a
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/common/aidl/android/hardware/common/*.aidl
          # Pass 0b
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/common/fmq/aidl/android/hardware/common/fmq/*.aidl
          # Pass 0c
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/common/*.aidl
          # Pass 1
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-system-interfaces/media/aidl/android/media/audio/common/*.aidl \
            aosp-system-interfaces/media/aidl/android/media/audio/eraser/*.aidl
          # Pass 2
          $AIDL --lang=ndk --structured --stability=vintf \
            --min_sdk_version=31 \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src \
            --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/effect/*.aidl

      - name: Build all AIDL ABIs & prepare module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make module-aidl \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload AIDL module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViPER4Android-RE-AIDL-${{ steps.ver.outputs.name }}
          path: out/magisk_module_aidl/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ package, package-aidl ]
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check if version already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download non-AIDL module directory
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ViPER4Android-RE-${{ steps.check.outputs.version }}
          path: dist/module/

      - name: Download AIDL module directory
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ViPER4Android-RE-AIDL-${{ steps.check.outputs.version }}
          path: dist/module-aidl/

      - name: Repackage as flashable zips
        if: steps.check.outputs.skip == 'false'
        run: |
          cd dist/module
          zip -r9 ../ViPER4Android-RE-${{ steps.check.outputs.version }}.zip .
          cd ../module-aidl
          zip -r9 ../ViPER4Android-RE-AIDL-${{ steps.check.outputs.version }}.zip .
          cd ../..

      - name: Generate update.json files
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          REPO="${{ github.repository }}"
          CHANGELOG="https://github.com/${REPO}/releases/tag/${VERSION}"

          cat > dist/update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/${REPO}/releases/download/${VERSION}/ViPER4Android-RE-${VERSION}.zip",
            "changelog": "${CHANGELOG}"
          }
          EOF

          cat > dist/update-aidl.json <<EOF
          {
            "version": "${VERSION}-aidl",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/${REPO}/releases/download/${VERSION}/ViPER4Android-RE-AIDL-${VERSION}.zip",
            "changelog": "${CHANGELOG}"
          }
          EOF

          echo "--- update.json ---" && cat dist/update.json
          echo "--- update-aidl.json ---" && cat dist/update-aidl.json

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   ${{ steps.check.outputs.version }}
          name:       "ViPER4Android RE ${{ steps.check.outputs.version }}"
          draft:      false
          prerelease: ${{ contains(steps.check.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/update.json
            dist/update-aidl.json
          body: |
            ## ViPER4Android Reverse Engineered ${{ steps.check.outputs.version }}

            ### Installation
            Flash the zip matching your device's audio HAL:
            - **`ViPER4Android-RE-*.zip`** — non-AIDL (Android ≤ 14 / legacy HAL)
            - **`ViPER4Android-RE-AIDL-*.zip`** — AIDL (Android 13+ / API 33+)

            Not sure which to use? Run: `adb shell ps -A | grep "audio.*aidl"`
            If you see a result, use the AIDL zip. Otherwise use the non-AIDL zip.

            ### Changes
            See [commits](https://github.com/${{ github.repository }}/commits/${{ steps.check.outputs.version }}) for details.
